name: ovftool Collector (Branch)
run-name: ${{ github.actor }} is Collecting a branch 🚀
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  Date:
    runs-on: ubuntu-24.04
    outputs:
      Date: ${{ steps.date.outputs.date }}
    steps:
      - name: Get current date
        id: DATE
        run: |
          echo "Setting Date"
          echo "DATE=$(date '+%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          echo -e "\nWrote to file:\n$GITHUB_OUTPUT\n"
          echo "Values:"
          cat $GITHUB_OUTPUT

  Skopeo:
    needs: [Date, Build]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install Skopeo
        run: |
          sudo apt-get update -y
          sudo apt-get install -y skopeo pigz

      - name: Login to ghcr.io
        run: |
          skopeo login ghcr.io \
            -u ${{ github.actor }} \
            -p ${{ env.GH_TOKEN }}

      - name: Run Skopeo Sync
        run: |
          skopeo sync \
            --src yaml --dest dir \
            ovftool.yml \
            ${{ vars.COLLECTOR }}-skopeo

      - name: Directory Contents
        run: |
          echo "Directory Contents"
          ls -lAhS *
          echo -e "\nDirectory Size"
          du -hd1

      - name: TARchive Skopeo Output
        run: |
          tar -cv -Ipigz --remove-files \
            -f ${{ vars.COLLECTOR }}-skopeo-${{ needs.Date.outputs.Date }}.tgz ${{ vars.COLLECTOR }}-skopeo \
          | tee ${{ vars.COLLECTOR }}-skopeo-${{ needs.Date.outputs.Date }}.tgz.txt

      - name: Generate Hash
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-skopeo-${{ needs.Date.outputs.Date }}.tgz | tee \
            ${{ vars.COLLECTOR }}-skopeo-${{ needs.Date.outputs.Date }}.tgz.sha

      - name: List files
        run: ls -Alh ${{ vars.COLLECTOR }}-skopeo-${{ needs.Date.outputs.Date }}.tgz*

      - name: Upload TARchive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-skopeo-${{ needs.Date.outputs.Date }}.tgz
          path: ${{ vars.COLLECTOR }}-skopeo-${{ needs.Date.outputs.Date }}.tgz*

  Code:
    needs: [Date]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Setup Git
        run: |
          git config user.name "$(git log -n 1 --pretty=format:%an)"
          git config user.email "$(git log -n 1 --pretty=format:%ae)"

      - name: Update Submodules if needed
        shell: bash
        run: git submodule update --init --recursive --remote

      - name: Bundle Repo1 code base for ${{ vars.COLLECTOR }}
        run: |
          git bundle create --progress ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.bundle --all
          echo -e "\nDirectory Listing $(ls -Alht *)"

      - name: Generate Hash
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.bundle | tee \
            ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.bundle.sha

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.bundle
          path: ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.bundle*

  Build:
    runs-on: ubuntu-latest
    needs: [Date]
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          # submodules: recursive

      - name: Checks
        run: |
          # git lfs pull # If using Git LFS
          echo "Directory Listing"
          ls -lAhS *
          echo -e "\nDirectory Size"
          du -hd1 .
          echo -e "\nValidate live OVF binary retrieval"
          TMP_BIN_DIR="$(mktemp -d)"
          chmod +x scripts/get_ovftool_latest_binaries.sh
          ./scripts/get_ovftool_latest_binaries.sh "$TMP_BIN_DIR"
          ls -Alh "$TMP_BIN_DIR"

          LINUX_ZIP_COUNT=$(find "$TMP_BIN_DIR" -maxdepth 1 -type f -name 'VMware-ovftool-*-lin.x86_64.zip' | wc -l)
          WIN_ZIP_COUNT=$(find "$TMP_BIN_DIR" -maxdepth 1 -type f -name 'VMware-ovftool-*-win.x86_64.zip' | wc -l)
          WIN_MSI_COUNT=$(find "$TMP_BIN_DIR" -maxdepth 1 -type f -name 'VMware-ovftool-*-win.x86_64.msi' | wc -l)

          [[ "$LINUX_ZIP_COUNT" -ge 1 ]] || { echo "Missing expected Linux OVF zip" >&2; exit 1; }
          [[ "$WIN_ZIP_COUNT" -ge 1 ]] || { echo "Missing expected Windows OVF zip" >&2; exit 1; }
          [[ "$WIN_MSI_COUNT" -ge 1 ]] || { echo "Missing expected Windows OVF msi" >&2; exit 1; }

          unzip -tq "$TMP_BIN_DIR"/*lin.x86_64.zip
          unzip -tq "$TMP_BIN_DIR"/*win.x86_64.zip
          sha256sum -b "$TMP_BIN_DIR"/*
          rm -rf "$TMP_BIN_DIR"

          echo -e "\nDockerfile"
          cat Dockerfile

      - name: Fail fast on Broadcom parser drift
        run: |
          chmod +x scripts/check_ovftool_parser_drift.sh
          ./scripts/check_ovftool_parser_drift.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute normalized image name (lowercase)
        id: names
        run: |
          REPO_LC="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${REPO_LC}" >> $GITHUB_ENV
          echo "IMAGE_SHA_TAG=ghcr.io/${REPO_LC}:sha-${{ github.sha }}" >> $GITHUB_ENV

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.GH_TOKEN }}

      - name: Login to registry1.dso.mil
        uses: docker/login-action@v4
        with:
          registry: registry1.dso.mil
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Validate final container can execute ovftool --version
        run: |
          docker build --target runtime -t ovftool-ci-validate .
          docker run --rm --entrypoint ovftool ovftool-ci-validate --version

      # Generate tags & labels (sha, branch, tag, latest on default branch)
      - name: Docker metadata (tags, labels) for meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Show metadata
        run: |
          echo "Registry: ghcr.io"
          echo "Version: ${{ steps.meta.outputs.version }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Labels: ${{ steps.meta.outputs.labels }}"

      # Build & push to GHCR
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Env info
        run: |
          echo "IMAGE: ${{ env.IMAGE }}"
          echo "IMAGE_SHA_TAG: ${{ env.IMAGE_SHA_TAG }}"
          echo "DIGEST: ${{ steps.build.outputs.digest }}"
          echo -e "\nComplete Env:\n$(env)"

      # Save the image as a .tar artifact (pull the sha-tag we just pushed)
      - name: Pull the pushed image (sha tag)
        run: docker pull "${{ env.IMAGE }}"

      - name: Save image to tarball
        run: docker save "${{ env.IMAGE }}" |gzip > "${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.tgz"

      - name: Generate Hash
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.tgz | tee \
            ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.tgz.sha

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.tgz
          path: ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.tgz*
          if-no-files-found: error

      # Install cosign for signing (keyless via GitHub OIDC)
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      # Sign the pushed image by digest (best practice)
      - name: Cosign sign image
        env:
          # --yes to avoid interactive prompt
          COSIGN_EXPERIMENTAL: "false"  # Not needed on modern cosign; kept explicit
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          # Sign the immutable digest reference
          cosign sign --yes "${{ env.IMAGE }}@${DIGEST}"

      # (Optional) Verify signature step — helpful during initial setup
      # - name: Cosign verify signature (optional)
      #   if: ${{ always() }}
      #   run: |
      #     DIGEST="${{ steps.build.outputs.digest }}"
      #     cosign verify "${{ env.IMAGE }}@${DIGEST}" \
      #       --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #       --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/${{ github.workflow }}@${{ github.ref }}"

  Scan:
    name: Compliance scan (Trivy + Grype)
    runs-on: ubuntu-latest
    needs: [Date, Skopeo]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download skopeo artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.tgz
          path: scan-input

      - name: Show downloaded files
        run: |
          set -euo pipefail
          echo "Downloaded files:"
          find scan-input -maxdepth 2 -type f | sort

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y curl tar jq

      - name: Install Trivy + Grype + skopeo
        run: |
          set -euo pipefail

          sudo apt-get update -y
          sudo apt-get install -y skopeo

          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin

          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Download report templates
        run: |
          set -euo pipefail
          mkdir -p templates

          curl -fsSL \
            -o templates/trivy-html.tpl \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl

          curl -fsSL \
            -o templates/grype-html.tmpl \
            https://raw.githubusercontent.com/anchore/grype/refs/heads/main/templates/html.tmpl

          ls -l templates

      - name: Extract synced images
        run: |
          set -euo pipefail

          mkdir -p extracted

          tgz="$(find scan-input -type f -name '*.tgz' | head -n 1)"
          [ -n "$tgz" ] || {
            echo "ERROR: no skopeo tgz artifact found"
            exit 1
          }

          echo "Extracting $tgz"
          tar -xvf "$tgz" -C extracted

          echo "Extracted contents:"
          find extracted -maxdepth 4 -type f | sort | head -200

      - name: Build local archive list from synced images
        run: |
          set -euo pipefail

          mkdir -p \
            scan-images \
            scan-results/trivy \
            scan-results/trivy-html \
            scan-results/grype \
            scan-results/grype-html

          : > scan-images/archives.txt

          find "extracted/${{ vars.COLLECTOR }}" -type f -name manifest.json | while read -r manifest; do
            img_dir="$(dirname "$manifest")"
            rel="${img_dir#extracted/${{ vars.COLLECTOR }}/}"
            safe="$(printf '%s' "$rel" | sed -E 's/[^A-Za-z0-9._-]+/_/g')"
            archive="scan-images/${safe}.tar"

            echo "Preparing archive from dir transport: $img_dir"

            skopeo copy \
              "dir:${img_dir}" \
              "docker-archive:${archive}:${safe}"

            echo "${img_dir}|${archive}|${safe}" >> scan-images/archives.txt
          done

          test -s scan-images/archives.txt || {
            echo "ERROR: no synced images found for scanning"
            exit 1
          }

          echo "Archive list:"
          cat scan-images/archives.txt
          
      - name: Trivy scan local synced images
        run: |
          set -euo pipefail
          : > scan-results/trivy-report.txt

          while IFS='|' read -r img_dir archive safe; do
            [ -n "$archive" ] || continue
            json_file="scan-results/trivy/${safe}.json"
            html_file="scan-results/trivy-html/${safe}.html"

            echo "=== Scanning ${img_dir} ===" | tee -a scan-results/trivy-report.txt

            trivy image \
              --quiet \
              --scanners vuln \
              --input "$archive" \
              --format json \
              -o "$json_file" \
              >> scan-results/trivy-report.txt 2>&1 || true

            if [ ! -s "$json_file" ]; then
              echo "FATAL: JSON output missing for ${img_dir} (${json_file})" | tee -a scan-results/trivy-report.txt
              continue
            fi

            trivy convert \
              --format template \
              --template "@templates/trivy-html.tpl" \
              --output "$html_file" \
              "$json_file" \
              >> scan-results/trivy-report.txt 2>&1 || true

            echo "=== ${img_dir} ===" >> scan-results/trivy-report.txt
            trivy convert --format table "$json_file" >> scan-results/trivy-report.txt 2>&1 || true
            echo >> scan-results/trivy-report.txt
          done < scan-images/archives.txt

          if grep -Eqi 'Fatal error|FATAL' scan-results/trivy-report.txt; then
            echo "Compliance failed: Trivy fatal/conversion error."
            exit 1
          fi

      - name: Grype scan local synced images
        run: |
          set -euo pipefail
          : > scan-results/grype-report.txt

          while IFS='|' read -r img_dir archive safe; do
            [ -n "$archive" ] || continue

            json_file="scan-results/grype/${safe}.json"
            html_file="scan-results/grype-html/${safe}.html"

            echo "=== Scanning ${img_dir} ===" | tee -a scan-results/grype-report.txt

            grype "docker-archive:${archive}" -o json \
              > "$json_file" \
              2>> scan-results/grype-report.txt || true

            grype "docker-archive:${archive}" \
              -o template \
              -t templates/grype-html.tmpl \
              > "$html_file" \
              2>> scan-results/grype-report.txt || true

            if [ ! -s "$json_file" ]; then
              echo "FATAL: JSON output missing for ${img_dir} (${json_file})" | tee -a scan-results/grype-report.txt
            fi

            if [ ! -s "$html_file" ]; then
              echo "FATAL: HTML output missing for ${img_dir} (${html_file})" | tee -a scan-results/grype-report.txt
            fi
          done < scan-images/archives.txt

      - name: Write vulnerability summary
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          trivy_dir = Path("scan-results/trivy")
          grype_dir = Path("scan-results/grype")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])

          severities = ["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"]

          def empty_counts():
              return {s: 0 for s in severities}

          def safe_sev(value):
              sev = str(value or "UNKNOWN").upper()
              return sev if sev in severities else "UNKNOWN"

          trivy_total_counts = empty_counts()
          grype_total_counts = empty_counts()
          trivy_rows = []
          grype_rows = []

          for jf in sorted(trivy_dir.glob("*.json")):
              try:
                  data = json.loads(jf.read_text())
              except Exception:
                  continue

              counts = empty_counts()
              for result in data.get("Results", []):
                  for vuln in result.get("Vulnerabilities", []) or []:
                      sev = safe_sev(vuln.get("Severity"))
                      counts[sev] += 1
                      trivy_total_counts[sev] += 1

              total = sum(counts.values())
              trivy_rows.append((jf.stem, counts, total))

          for jf in sorted(grype_dir.glob("*.json")):
              try:
                  data = json.loads(jf.read_text())
              except Exception:
                  continue

              counts = empty_counts()
              for match in data.get("matches", []) or []:
                  sev = safe_sev((match.get("vulnerability", {}) or {}).get("severity"))
                  counts[sev] += 1
                  grype_total_counts[sev] += 1

              total = sum(counts.values())
              grype_rows.append((jf.stem, counts, total))

          def counts_table(title, totals):
              lines = []
              lines.append(f"## {title}")
              lines.append("")
              lines.append("| Severity | Count |")
              lines.append("|---|---:|")
              for sev in severities:
                  lines.append(f"| {sev} | {totals[sev]} |")
              lines.append(f"| **TOTAL** | **{sum(totals.values())}** |")
              lines.append("")
              return lines

          def per_image_table(title, rows):
              lines = []
              lines.append(f"## {title}")
              lines.append("")
              lines.append("| Image | Critical | High | Medium | Low | Unknown | Total |")
              lines.append("|---|---:|---:|---:|---:|---:|---:|")
              for name, counts, total in rows:
                  lines.append(
                      f"| `{name}` | {counts['CRITICAL']} | {counts['HIGH']} | {counts['MEDIUM']} | {counts['LOW']} | {counts['UNKNOWN']} | {total} |"
                  )
              lines.append("")
              return lines

          lines = ["# Vulnerability Summary", ""]
          lines += counts_table("Trivy Totals", trivy_total_counts)
          lines += counts_table("Grype Totals", grype_total_counts)
          lines += per_image_table("Trivy Per Image", trivy_rows)
          lines += per_image_table("Grype Per Image", grype_rows)

          with summary_path.open("a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY
          
      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}-scan
          path: |
            scan-results/
            scan-images/archives.txt
            templates/
          if-no-files-found: error

  MakeISO:
    runs-on: ubuntu-latest
    needs: [Date, Code, Build, Scan]
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "!*.dockerbuild"
          merge-multiple: true
          path: ${{ vars.COLLECTOR }}

      - name: Copy Markdowns to ${{ vars.COLLECTOR }} ISO
        run: cp -v *.md ${{ vars.COLLECTOR }}/

      - name: Download Binaries
        run: |
          BIN_DIR="${{ vars.COLLECTOR }}/binaries"
          mkdir -p "$BIN_DIR"

          echo -e "\nWorking with github repo vmware/govmomi\n"
          echo -e "Listing last release: $(gh release list -R vmware/govmomi | head -n1)"
          echo -e "\nDownloading latest govc binaries to $BIN_DIR"
          gh release download \
            -p "*Windows_x86_64*" \
            -p "*Linux_x86_64*" \
            -p "*linux_amd64*" \
            -D "$BIN_DIR" \
            -R vmware/govmomi

          echo -e "\nDownloading latest OVF Tool Linux/Windows binaries to $BIN_DIR"
          chmod +x scripts/get_ovftool_latest_binaries.sh
          ./scripts/get_ovftool_latest_binaries.sh "$BIN_DIR"

          echo -e "\nBinaries Directory Listing"
          ls -Alh "$BIN_DIR"

      - name: Show Artifacts
        run: ls -Alh ${{ vars.COLLECTOR }}/*

      - name: Generate Artifact Hash File
        run: |
          find ${{ vars.COLLECTOR }} -type f -print0 | xargs -0 sha256sum -b | tee \
          ${{ vars.COLLECTOR }}/${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.sha

      - name: Upload Artifact Hash File
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.sha
          path: ${{ vars.COLLECTOR }}/${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.sha

      - name: ISO Table of contents
        run: |
          tree -a ${{ vars.COLLECTOR }} \
            | tee ${{ vars.COLLECTOR }}/${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.iso.txt

      - name: Upload iso ToC artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.iso.txt
          path: ${{ vars.COLLECTOR }}/${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.iso.txt
          if-no-files-found: error

      - name: Assert expected OVF binaries exist before mkisofs
        run: |
          set -euo pipefail
          BIN_DIR="${{ vars.COLLECTOR }}/binaries"
          echo "Checking required OVF binaries in ${BIN_DIR}"
          test -d "$BIN_DIR" || { echo "Missing binaries directory: $BIN_DIR" >&2; exit 1; }

          LINUX_COUNT=$(find "$BIN_DIR" -maxdepth 1 -type f -name 'VMware-ovftool-*-lin.x86_64.zip' | wc -l)
          WIN_ZIP_COUNT=$(find "$BIN_DIR" -maxdepth 1 -type f -name 'VMware-ovftool-*-win.x86_64.zip' | wc -l)
          WIN_MSI_COUNT=$(find "$BIN_DIR" -maxdepth 1 -type f -name 'VMware-ovftool-*-win.x86_64.msi' | wc -l)

          [[ "$LINUX_COUNT" -ge 1 ]] || { echo "Missing expected Linux OVF zip in $BIN_DIR" >&2; exit 1; }
          [[ "$WIN_ZIP_COUNT" -ge 1 ]] || { echo "Missing expected Windows OVF zip in $BIN_DIR" >&2; exit 1; }
          [[ "$WIN_MSI_COUNT" -ge 1 ]] || { echo "Missing expected Windows OVF msi in $BIN_DIR" >&2; exit 1; }

          echo "OVF binary assertion passed"

      - name: Install mkisofs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mkisofs isomd5sum

      - name: Make ISO
        run: |
          mkisofs -J -R -v -T -l \
            -V '${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}' \
            -A '${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}' \
            -o ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.iso \
            ${{ vars.COLLECTOR }}

      - name: Implant MD5 sum into iso
        run: implantisomd5 ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.iso

      - name: Generate ISO Hash
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.iso | tee \
            ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.iso.sha

      - name: Show ISO Artifacts
        run: ls -Alh *.iso*

      - name: Upload ISO Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.iso
          path: ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.iso*
          if-no-files-found: error

  Release:
    runs-on: ubuntu-24.04
    needs: [Date, MakeISO]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          pattern: "!*.dockerbuild"

      - name: Show Artifacts
        run: ls -Alh ${{ vars.COLLECTOR }}-*.*

      - name: Set up git
        run: |
          git config user.name "$(git log -n 1 --pretty=format:%an)"
          git config user.email "$(git log -n 1 --pretty=format:%ae)"

      - name: Optionally sign release artifacts (PKCS#12)
        env:
          CODE_SIGN_CERT_B64: ${{ secrets.CODE_SIGN_CERT_PAPPASJ }}
          CODE_SIGN_CERT_PASS: ${{ secrets.CODE_SIGN_CERT_PASS }}
        run: |
          set -eo pipefail
          if [[ -z "${CODE_SIGN_CERT_B64:-}" || -z "${CODE_SIGN_CERT_PASS:-}" ]]; then
            echo "PKCS#12 signing secrets/vars not set; skipping artifact signing."
            exit 0
          fi

          CERT_P12="codesign.p12"
          KEY_PEM="codesign.key.pem"
          CERT_PEM="${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}-codesign-cert.pem"

          echo "$CODE_SIGN_CERT_B64" | base64 -d > "$CERT_P12"
          openssl pkcs12 -legacy -in "$CERT_P12" -nocerts -nodes -passin env:CODE_SIGN_CERT_PASS -out "$KEY_PEM"
          openssl pkcs12 -legacy -in "$CERT_P12" -clcerts -nokeys -passin env:CODE_SIGN_CERT_PASS -out "$CERT_PEM"

          SIGNED_COUNT=0
          for f in ${{ vars.COLLECTOR }}-*.*; do
            [[ -f "$f" ]] || continue
            openssl dgst -sha256 -sign "$KEY_PEM" -out "${f}.sig" "$f"
            SIGNED_COUNT=$((SIGNED_COUNT+1))
          done

          echo "Signed $SIGNED_COUNT artifact files."
          ls -Alh ${{ vars.COLLECTOR }}-*.*.sig "$CERT_PEM"
          rm -f "$CERT_P12" "$KEY_PEM"

      - name: Upload signatures and certificate
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}-signatures
          path: |
            ${{ vars.COLLECTOR }}-*.*.sig
            ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}-codesign-cert.pem
          if-no-files-found: ignore

  Sharepoint:
    runs-on: ubuntu-24.04
    needs: [Date, MakeISO]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Download Container Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          pattern: "!*.dockerbuild"

      - name: Show Artifacts
        run: ls -Alh ${{ vars.COLLECTOR }}-*.*

