  Code:
    needs: [Date]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Git
        run: |
          git config user.name "$(git log -n 1 --pretty=format:%an)"
          git config user.email "$(git log -n 1 --pretty=format:%ae)"

      - name: Update Submodules if needed
        shell: bash
        run: git submodule update --init --recursive --remote

      - name: Bundle Repo1 code base for ${{ vars.COLLECTOR }}
        run: |
          git bundle create --progress ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.bundle --all
          echo -e "\nDirectory Listing $(ls -Alht *)"

      - name: Generate Hash
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.bundle | tee \
            ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.bundle.sha

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.bundle
          path: ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.bundle*

  Build:
    runs-on: ubuntu-latest
    needs: [Date]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          # submodules: recursive

      - name: Checks
        run: |
          # git lfs pull # If using Git LFS
          echo "Directory Listing"
          ls -lAhS *
          echo -e "\nDirectory Size"
          du -hd1 .
          echo -e "\nSha256 Sums"
          cd binaries
          sha256sum -c *.sha || exit 1
          echo -e "\nTar Status"
          tar -tzvf *ovftool*.tgz
          cd ..
          echo -e "\nDockerfile"
          cat Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute normalized image name (lowercase)
        id: names
        run: |
          REPO_LC="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${REPO_LC}" >> $GITHUB_ENV
          echo "IMAGE_SHA_TAG=ghcr.io/${REPO_LC}:sha-${{ github.sha }}" >> $GITHUB_ENV

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.GH_TOKEN }}

      - name: Login to registry1.dso.mil
        uses: docker/login-action@v3
        with:
          registry: registry1.dso.mil
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # Generate tags & labels (sha, branch, tag, latest on default branch)
      - name: Docker metadata (tags, labels) for meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Show metadata
        run: |
          echo "Registry: ghcr.io"
          echo "Version: ${{ steps.meta.outputs.version }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Labels: ${{ steps.meta.outputs.labels }}"

      # Build & push to GHCR
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Env info
        run: |
          echo "IMAGE: ${{ env.IMAGE }}"
          echo "IMAGE_SHA_TAG: ${{ env.IMAGE_SHA_TAG }}"
          echo "DIGEST: ${{ steps.build.outputs.digest }}"
          echo -e "\nComplete Env:\n$(env)"

      # Save the image as a .tar artifact (pull the sha-tag we just pushed)
      - name: Pull the pushed image (sha tag)
        run: docker pull "${{ env.IMAGE }}"

      - name: Save image to tarball
        run: docker save "${{ env.IMAGE }}" |gzip > "${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.tgz"

      - name: Generate Hash
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.tgz | tee \
            ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.tgz.sha

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.tgz
          path: ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.tgz*
          if-no-files-found: error

      # Install cosign for signing (keyless via GitHub OIDC)
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Sign the pushed image by digest (best practice)
      - name: Cosign sign image
        env:
          # --yes to avoid interactive prompt
          COSIGN_EXPERIMENTAL: "false"  # Not needed on modern cosign; kept explicit
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          # Sign the immutable digest reference
          cosign sign --yes "${{ env.IMAGE }}@${DIGEST}"

      # (Optional) Verify signature step — helpful during initial setup
      # - name: Cosign verify signature (optional)
      #   if: ${{ always() }}
      #   run: |
      #     DIGEST="${{ steps.build.outputs.digest }}"
      #     cosign verify "${{ env.IMAGE }}@${DIGEST}" \
      #       --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #       --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/${{ github.workflow }}@${{ github.ref }}"

  MakeISO:
    runs-on: ubuntu-latest
    needs: [Date, Code, Build]
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: "!*.dockerbuild"
          merge-multiple: true
          path: ${{ vars.COLLECTOR }}

      - name: Copy Markdowns to ${{ vars.COLLECTOR }} ISO
        run: cp -v *.md ${{ vars.COLLECTOR }}/

      - name: Download Binaries
        run: |
          echo -e "\nWorking with github repo vmware/govmomi\n"
          echo -e "Listing last release: $(gh release list -R vmware/govmomi | head -n1)"
          echo -e "\nDownloading Latest to binaries"
          gh release download \
            -p "*Windows_x86_64*" \
            -p "*Linux_x86_64*" \
            -p "*linux_amd64*" \
            -D binaries \
            -R vmware/govmomi
          cd binaries
          echo -e "\nDirectory Listing $(ls -1Ssh)\n"

      - name: Show Artifacts
        run: ls -Alh ${{ vars.COLLECTOR }}/*

      - name: Generate Artifact Hash File
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}/*.* | tee \
          ${{ vars.COLLECTOR }}/${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.sha

      - name: Upload Artifact Hash File
        uses: actions/upload-artifact@v4
        with:
          name: ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.sha
          path: ${{ vars.COLLECTOR }}/${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.sha

      - name: ISO Table of contents
        run: |
          tree -a ${{ vars.COLLECTOR }} \
            | tee ${{ vars.COLLECTOR }}/${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.iso.txt

      - name: Upload iso ToC artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.iso.txt
          path: ${{ vars.COLLECTOR }}/${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.iso.txt
          if-no-files-found: error

      - name: Install mkisofs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mkisofs isomd5sum

      - name: Make ISO
        run: |
          mkisofs -J -R -v -T -l \
            -V '${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}' \
            -A '${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}' \
            -o ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.iso \
            ${{ vars.COLLECTOR }}

      - name: Implant MD5 sum into iso
        run: implantisomd5 ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.iso

      - name: Generate ISO Hash
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.iso | tee \
            ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.iso.sha

      - name: Show ISO Artifacts
        run: ls -Alh *.iso*

      - name: Upload ISO Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.iso
          path: ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.iso*
          if-no-files-found: error

  Release:
    runs-on: ubuntu-24.04
    needs: [Date, MakeISO]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          pattern: "!*.dockerbuild"

      - name: Show Artifacts
        run: ls -Alh ${{ vars.COLLECTOR }}-*.*

      - name: Set up git
        run: |
          git config user.name "$(git log -n 1 --pretty=format:%an)"
          git config user.email "$(git log -n 1 --pretty=format:%ae)"

      - name: Create tag
        uses: rickstaa/action-create-tag@v1
        id: tag_create
        with:
          tag: ${{ needs.Date.outputs.Date }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_exists_error: false
          message: "Release for ${{ needs.Date.outputs.Date }} run"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ vars.COLLECTOR }} ${{ needs.Date.outputs.Date }}
          tag_name: ${{ needs.Date.outputs.Date }}
          make_latest: true
          files: |
            ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.bundle
            ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.tgz
            ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}.zip
            ${{ vars.COLLECTOR }}*.gz
            ${{ vars.COLLECTOR }}*.txt

  Sharepoint:
    runs-on: ubuntu-24.04
    needs: [Date, MakeISO]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Download Container Artifacts
        uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          pattern: "!*.dockerbuild"

      - name: Show Artifacts
        run: ls -Alh ${{ vars.COLLECTOR }}-*.*

      - name: Send Files to Sharepoint
        uses: amentumcms/sharepoint-file-upload-action@main
        with:
          file_path: "${{ vars.COLLECTOR }}-*.*"
          host_name: ${{ secrets.SHAREPOINT_HOST }}
          site_name: ${{ secrets.SHAREPOINT_SITE }}
          upload_path: '${{ secrets.SHAREPOINT_BASEPATH }}/${{ vars.COLLECTOR }}/${{ needs.Date.outputs.Date }}'
          tenant_id: ${{ secrets.SHAREPOINT_TENANT_ID }}
          client_id: ${{ secrets.SHAREPOINT_APP_ID }}
          client_secret: ${{ secrets.SHAREPOINT_APP_SECRET }}
          login_endpoint: 'login.microsoftonline.us'
          graph_endpoint: 'graph.microsoft.us'
